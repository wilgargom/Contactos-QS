name: Validate and deploy Contactos QS to Azure

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Test startup, frontend, API and persistent storage
        run: npm test
      - name: Prepare runtime files at package root
        run: npm run package:azure
      - name: Test the exact deployment package
        run: npm test
        env:
          APP_ROOT: build/azure
      - name: Upload deployment package
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: build/azure/
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: node-app
          path: app
      # Este proyecto no tiene dependencias npm externas. El paquete incluye
      # server.js, web.config, package.json, src/ y public/ en su raíz.
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: tec-qs-contacts
          slot-name: Production
          package: app
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_327962A93D87413699A178BF9ACFBBC4 }}
